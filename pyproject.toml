[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "geovista-sdk"
version = "1.0.0"
description = "Python SDK for GeoVista Dataset & AI Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["geovista", "sdk", "dataset", "ai", "machine-learning"]

authors = [
    { name = "GeoVista", email = "support@geovista.com" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "httpx>=0.27,<1.0"
]

[project.urls]
Homepage = "https://github.com/geovista/geovista-sdk"
Documentation = "https://docs.geovista.com"
Repository = "https://github.com/geovista/geovista-sdk"
Issues = "https://github.com/geovista/geovista-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.23"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
geovista = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]