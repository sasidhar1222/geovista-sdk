[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "mycompany-sdk"
version = "1.0.0"
description = "Python SDK for MyCompany API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "MyCompany" }
]

dependencies = [
    "httpx>=0.27,<1.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.23"
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]